<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      No `maximum-scale` and no `user-scalable=no` here, unlike the expanded
      game. This page is the *inline* surface, and Devvit's inline requirements
      list "No zoom or pan interference" alongside the scroll rules: a card in
      the feed may not take pinch-zoom away from the person scrolling past it.
      The expanded view is where richer gesture handling belongs.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DAYSHOT</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      The feed card, in plain DOM and canvas.

      Not React: the runtime chunk alone is 65 KB gzip against a 60 KB budget
      for everything the feed loads, and this page is a canvas, four text nodes
      and a button. Measured after: 35 KB including the font.
    -->
    <script type="module" src="inline/main.ts"></script>
  </body>
</html>
